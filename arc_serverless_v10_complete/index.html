<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ARC v10 Offline Worldmap</title>
<!-- Offline build: Leaflet + heat + sql.js are vendored in ./vendor — no CDN, no network. -->
<link rel="stylesheet" href="vendor/leaflet.css"/>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script src="vendor/sql-wasm.js"></script>
<script src="vendor/Leaflet.TileLayer.MBTiles.js"></script>
<style>
html,body,#map{height:100%;margin:0;background:#000}
#ui{
position:absolute;top:10px;left:10px;background:#111;color:#0f0;
padding:10px;font-family:monospace;z-index:999;width:250px;
max-height:calc(100% - 20px);overflow-y:auto;
}
button{width:100%;margin-top:4px}
input,select{width:100%;margin-top:4px;background:#000;color:#0f0;border:1px solid #0f0;font-family:monospace}
label{font-size:11px;display:block;margin-top:6px}
canvas{position:absolute;top:0;left:0;pointer-events:none}
#gpsStatus,#roomStatus,#accuracyLine{font-size:11px;margin-top:4px;min-height:14px}
#simBadge{display:none;color:#000;background:#ff0;font-weight:bold;padding:1px 5px;margin-top:4px}
#simBadge.on{display:inline-block}
.room-label{background:transparent;border:none;color:#6cf;font:11px monospace;text-shadow:0 0 3px #000}
details{margin-top:8px}
details summary{cursor:pointer;font-size:11px}
</style>
</head>
<body>

<div id="ui">
<b>ARC v10 Offline Worldmap</b> <span id="simBadge">SIMULATED</span><br>
<button onclick="startSim()">Start demo signals</button>
<button onclick="stopSim()">Stop</button>
<button onclick="toggleSensors()">Show sensors</button>
<button onclick="togglePath()">Show paths</button>
<button onclick="togglePlaceSensor()">Add a sensor (click the map)</button>
<button onclick="placeSensorsForMe()">Place sensors for me</button>
<button onclick="runRoomInference()">What room is this?</button>
<button onclick="runAccuracyCheck()">How accurate is this?</button>
<button onclick="runCalibration()">Calibrate</button>
<button onclick="exportEvidence()">Save my data</button>
<div id="stats"></div>
<div id="accuracyLine"></div>
<div id="roomStatus"></div>
<div id="gpsStatus"></div>

<label>Where do locations come from?
<select id="gpsSource">
<option value="none">Nothing yet</option>
<option value="simulator">Demo signals (simulated)</option>
<option value="geolocation">Device GPS</option>
<option value="gpx">GPX file</option>
<option value="nmea">NMEA file</option>
</select>
</label>
<label>GPX file <input id="gpxFile" type="file" accept=".gpx,.xml"></label>
<label>NMEA file <input id="nmeaFile" type="file" accept=".nmea,.txt"></label>

<label>Map picture
<select id="tileMode">
<option value="grid">Grid (no files — offline)</option>
<option value="mbtiles">Map file (.mbtiles)</option>
<option value="local">Local tile folder</option>
<option value="url">Web address</option>
</select>
</label>
<label>Map file (.mbtiles) <input id="mbtilesFile" type="file" accept=".mbtiles"></label>
<label>Floor plan (GeoJSON) <input id="floorPlanFile" type="file" accept=".geojson,.json"></label>
<label>Signal scan (CSV / JSON / airport) <input id="scanFile" type="file" accept=".csv,.json,.txt"></label>
<label>Sensors file (JSON / CSV) <input id="sensorFile" type="file" accept=".json,.csv"></label>

<details>
<summary>More settings</summary>
<label>Centre latitude <input id="centerLat" type="number" step="0.001" min="-90" max="90"></label>
<label>Centre longitude <input id="centerLon" type="number" step="0.001" min="-180" max="180"></label>
<label>Zoom <input id="zoom" type="number" step="1" min="0" max="19"></label>
<label>Tile folder / path <input id="tilePath" type="text" placeholder="tiles or file:///path/to/tiles"></label>
<label>Tile web address <input id="tileUrlTemplate" type="text" placeholder="https://{s}.tile.example.com/{z}/{x}/{y}.png"></label>
<label>Demo device names (comma separated) <input id="simulatorDevices" type="text"></label>
<label>How positions are worked out
<select id="estimatorMethod">
<option value="multilateration">Best fit from signal strength</option>
<option value="weighted">Weighted average</option>
<option value="weighted-rssi-centroid">Weighted RSSI centroid (ARC-Core)</option>
</select>
</label>
<label><input id="useFilter" type="checkbox" style="width:auto"> Smooth the track</label>
<label><input id="fingerprintMode" type="checkbox" style="width:auto"> Use my surveyed map instead</label>
<label>Signal setting
<select id="calibrationProfile">
<option value="balanced">Balanced</option>
<option value="urban">City (dense)</option>
<option value="residential">Home</option>
<option value="interference">Noisy</option>
<option value="arc-default">ARC-Core default (2.2 / 3.5 / 0.65)</option>
<option value="wizard">Calibrated by me</option>
</select>
</label>
<label><input id="showPaths" type="checkbox" style="width:auto"> Show paths</label>
<button onclick="applyWorldmapSettingsFromUI()">Apply settings</button>
</details>

<details id="continuumPanel">
<summary>Continuum — structures, geofences &amp; heat</summary>
<div style="font-size:11px">ARC-Core's geospatial surface: the three seeded Williams Lake structures, their perimeter geofences, zones and the track heat grid. Every fix is classified into a zone with its geofence hits.</div>
<button onclick="toggleContinuum()">Show structures &amp; geofences</button>
<button onclick="toggleContinuumHeat()">Show track heat grid</button>
<div id="continuumStatus" style="font-size:11px;margin-top:4px"></div>
<div id="continuumStructures" style="font-size:11px;margin-top:4px"></div>
<div id="continuumCalibrations" style="font-size:11px;margin-top:4px"></div>
<label>Blueprint image (local file)
<select id="blueprintStructure"></select>
<input id="blueprintFile" type="file" accept="image/*"></label>
<div id="continuumBlueprints" style="font-size:11px;margin-top:4px"></div>
<div id="continuumTracks" style="font-size:11px;margin-top:4px"></div>
</details>
</div>

<div id="map"></div>
<canvas id="rf"></canvas>

<script src="arc/bus.js"></script>
<script src="arc/entities.js"></script>
<script src="arc/geo.js"></script>
<script src="arc/pathloss.js"></script>
<script src="arc/estimator.js"></script>
<script src="arc/continuum.js"></script>
<script src="arc/filter.js"></script>
<script src="arc/lab.js"></script>
<script src="arc/evidence.js"></script>
<script src="arc/simulator.js"></script>
<script src="arc/triangulation.js"></script>
<script src="arc/map.js"></script>
<script src="arc/sensors.js"></script>
<script src="arc/rf_canvas.js"></script>
<script src="arc/room_inference.js"></script>
<script src="arc/fingerprint.js"></script>
<script src="arc/tiles.js"></script>
<script src="arc/rfimport.js"></script>
<script src="arc/gps.js"></script>
<script src="arc/settings.js"></script>

<script>
/* Boot: settings first (localStorage standalone, or the parent
 * pushes its own over postMessage once embedded), then map + RF.
 * Defaults work with zero configuration: grid map, no GPS
 * source, demo signals off. */
const bootSettings = WorldmapSettings.load();
initMap(bootSettings);
initRF();
applyEngineSettings(bootSettings);
try { WorldmapSensors.SensorStore.load(); } catch (e) { /* start empty */ }
try { WorldmapRF.setRFSensors(WorldmapSensors.SensorStore.list()); } catch (e) { /* no sensors yet */ }
syncWorldmapSettingsUI(bootSettings);
renderContinuumPanel();

let placeSensorMode = false;

function gpsStatus(text) {
  const el = document.getElementById('gpsStatus');
  if (el) el.textContent = text;
}

function setSimBadge(on) {
  const el = document.getElementById('simBadge');
  if (el) el.className = on ? 'on' : '';
}

/* Engine globals the triangulation handler reads: which
 * estimator, whether the track is smoothed, and which
 * calibration profile. Set from settings on boot and on
 * every settings change. */
function applyEngineSettings(settings) {
  window.worldmapEstimatorMethod = settings.estimatorMethod || 'multilateration';
  window.worldmapUseFilter = settings.useFilter !== false;
  window.worldmapShowContinuum = settings.showContinuum !== false;
  window.worldmapShowContinuumHeat = settings.showContinuumHeat === true;
  if (typeof WorldmapEstimator !== 'undefined' && WorldmapEstimator.setProfile) {
    WorldmapEstimator.setProfile(settings.calibrationProfile || 'balanced');
  }
  if (typeof WorldmapFingerprint !== 'undefined' && WorldmapFingerprint.setMode) {
    WorldmapFingerprint.setMode(settings.fingerprintMode ? 'fingerprint' : 'ranging');
  }
  setSimBadge(settings.gpsSource === 'simulator');
}

/* Called by settings.js whenever settings change (UI apply or a
 * postMessage from the parent). Re-points the map, swaps the tile
 * layer, and switches the GPS source. */
function applyWorldmapSettings(settings) {
  if (typeof map !== 'undefined' && map) {
    map.setView([settings.centerLat, settings.centerLon], settings.zoom);
    setTileLayer(settings);
    showPath = settings.showPaths !== false;
  }
  applyEngineSettings(settings);
  stopSim();
  WorldmapGPS.stopGeolocation();
  devices = (settings.simulatorDevices || ['phone1', 'phone2']).slice();
  simulatorIntervalMs = settings.simulatorIntervalMs || 600;
  if (settings.gpsSource === 'simulator') {
    startSim();
    gpsStatus('Demo signals running: ' + devices.join(', ') + ' (simulated).');
  } else if (settings.gpsSource === 'geolocation') {
    const ok = WorldmapGPS.startGeolocation(
      (fix) => WorldmapGPS.feedFixes('gps', [fix]),
      (err) => gpsStatus('GPS unavailable: ' + err)
    );
    if (ok) gpsStatus('Device GPS: waiting for a fix…');
  } else if (settings.gpsSource === 'gpx' || settings.gpsSource === 'nmea') {
    gpsStatus('Pick a .' + settings.gpsSource + ' file below to plot it.');
  } else {
    gpsStatus('');
  }
}

function syncWorldmapSettingsUI(settings) {
  const set = (id, value) => { const el = document.getElementById(id); if (el) el.value = value; };
  set('gpsSource', settings.gpsSource);
  set('centerLat', settings.centerLat);
  set('centerLon', settings.centerLon);
  set('zoom', settings.zoom);
  set('tileMode', settings.tileMode);
  set('tilePath', settings.tilePath);
  set('tileUrlTemplate', settings.tileUrlTemplate);
  set('simulatorDevices', (settings.simulatorDevices || []).join(', '));
  set('estimatorMethod', settings.estimatorMethod || 'multilateration');
  set('calibrationProfile', settings.calibrationProfile || 'balanced');
  const paths = document.getElementById('showPaths');
  if (paths) paths.checked = settings.showPaths !== false;
  const filt = document.getElementById('useFilter');
  if (filt) filt.checked = settings.useFilter !== false;
  const fp = document.getElementById('fingerprintMode');
  if (fp) fp.checked = settings.fingerprintMode === true;
}

function applyWorldmapSettingsFromUI() {
  const num = (id) => { const v = parseFloat(document.getElementById(id).value); return Number.isFinite(v) ? v : undefined; };
  const str = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const paths = document.getElementById('showPaths');
  const filt = document.getElementById('useFilter');
  const fp = document.getElementById('fingerprintMode');
  WorldmapSettings.set({
    centerLat: num('centerLat'),
    centerLon: num('centerLon'),
    zoom: num('zoom'),
    tileMode: str('tileMode'),
    tilePath: str('tilePath'),
    tileUrlTemplate: str('tileUrlTemplate'),
    gpsSource: str('gpsSource'),
    simulatorDevices: (str('simulatorDevices') || '').split(',').map(s => s.trim()).filter(Boolean),
    showPaths: paths ? paths.checked : undefined,
    estimatorMethod: str('estimatorMethod'),
    useFilter: filt ? filt.checked : undefined,
    fingerprintMode: fp ? fp.checked : undefined,
    calibrationProfile: str('calibrationProfile'),
  });
}

/* Continuum panel (ARC-Core geo console, /ui/geo.html):
 * structures, calibration profiles, blueprint overlays and the
 * latest tracks. The toggles flip the map layers without
 * restarting the engine — they save the setting directly
 * instead of going through WorldmapSettings.set (which
 * re-applies the whole engine: tiles, GPS source, simulator). */
function continuumSetting(key, value) {
  const s = WorldmapSettings.get();
  s[key] = value;
  WorldmapSettings.current = sanitizeWorldmapSettings(s);
  WorldmapSettings.save();
  WorldmapSettings.postToParent({ type: 'worldmap:settings-changed', settings: WorldmapSettings.get() });
}

function toggleContinuum() {
  const next = !((WorldmapSettings.get() || {}).showContinuum !== false);
  window.worldmapShowContinuum = next;
  continuumSetting('showContinuum', next);
  if (typeof renderContinuumOnMap === 'function') renderContinuumOnMap();
  renderContinuumPanel();
}

function toggleContinuumHeat() {
  const next = !((WorldmapSettings.get() || {}).showContinuumHeat === true);
  window.worldmapShowContinuumHeat = next;
  continuumSetting('showContinuumHeat', next);
  if (typeof renderContinuumOnMap === 'function') renderContinuumOnMap();
  renderContinuumPanel();
}

function renderContinuumPanel() {
  if (typeof WorldmapContinuum === 'undefined') return;
  const structuresEl = document.getElementById('continuumStructures');
  if (structuresEl) {
    structuresEl.innerHTML = '<b>Structures</b><br>' + WorldmapContinuum.CONTINUUM_STRUCTURES.map((s) =>
      s.name + ' · ' + s.structure_type + ' · ' + s.levels + ' level' + (s.levels === 1 ? '' : 's') + ' · ' + s.address
    ).join('<br>');
  }
  const calEl = document.getElementById('continuumCalibrations');
  if (calEl) {
    const active = (WorldmapSettings.get() || {}).calibrationProfile === 'arc-default';
    calEl.innerHTML = '<b>Calibration profiles</b>' + (active ? ' · ARC-Core default in use' : '') + '<br>' +
      WorldmapContinuum.CONTINUUM_CALIBRATIONS.map((c) =>
        c.name + ' · path loss ' + c.profile.path_loss + ' · noise ' + c.profile.noise_db + ' dB · smoothing ' + c.profile.smoothing
      ).join('<br>');
  }
  const bpEl = document.getElementById('continuumBlueprints');
  if (bpEl) {
    bpEl.innerHTML = '<b>Blueprint overlays</b><br>' + WorldmapContinuum.listBlueprintOverlays().map((b) =>
      b.name + ' · opacity ' + b.opacity + ' · floor ' + b.floor + (b.imageLoaded ? ' · image attached' : ' · no image yet')
    ).join('<br>');
  }
  const sel = document.getElementById('blueprintStructure');
  if (sel && !sel.options.length) {
    WorldmapContinuum.CONTINUUM_STRUCTURES.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      sel.appendChild(opt);
    });
  }
  updateContinuumUI();
}

/* Latest-fix status + recent tracks (geo.html's tracks table,
 * compact): refreshed on every map update, cheap text only. */
function updateContinuumUI() {
  const statusEl = document.getElementById('continuumStatus');
  const tracksEl = document.getElementById('continuumTracks');
  if (!statusEl && !tracksEl) return;
  if (typeof graph === 'undefined' || !graph || !graph.devices) return;
  const rows = [];
  Object.entries(graph.devices).forEach(([name, d]) => {
    (d.locations || []).slice(-5).forEach((loc) => rows.push({ device: name, loc }));
  });
  const latest = rows.length ? rows[rows.length - 1] : null;
  if (statusEl && latest) {
    const hits = (latest.loc.geofenceHits || []).map((h) => h.name + ' (severity ' + h.severity + ')');
    statusEl.textContent = latest.device + ': ' + (latest.loc.zone || 'outside every structure') +
      (hits.length ? ' · inside ' + hits.join(', ') : ' · no geofence hit');
  }
  if (tracksEl && rows.length) {
    tracksEl.innerHTML = '<b>Recent tracks</b><br>' + rows.slice(-5).reverse().map((r) =>
      r.device + ' · ' + (r.loc.zone || '—') + ' · conf ' + Number(r.loc.confidence || 0).toFixed(2) + ' · ' + (r.loc.method || '')
    ).join('<br>');
  }
}

document.getElementById('blueprintFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file || typeof WorldmapContinuum === 'undefined') return;
  const sel = document.getElementById('blueprintStructure');
  const structureId = sel ? sel.value : null;
  const attached = WorldmapContinuum.attachBlueprintImage(structureId, file);
  if (attached) {
    if (typeof renderContinuumOnMap === 'function') renderContinuumOnMap();
    renderContinuumPanel();
    gpsStatus('Blueprint attached: ' + attached.name + '.');
  } else {
    gpsStatus('Blueprint failed: pick a structure first.');
  }
});

/* One-click accuracy check (Accuracy Lab): runs the seeded
 * test track through the current estimator and reports the
 * error in plain words. Nothing is claimed without this. */
function runAccuracyCheck() {
  const line = document.getElementById('accuracyLine');
  if (typeof WorldmapLab === 'undefined' || !WorldmapLab.runAccuracyLab) {
    if (line) line.textContent = 'Accuracy check is not loaded.';
    return;
  }
  const settings = WorldmapSettings.get();
  const method = settings.estimatorMethod || 'multilateration';
  let report;
  try {
    report = WorldmapLab.runAccuracyLab({ frames: 120, seed: 101, method });
  } catch (e) {
    if (line) line.textContent = 'Accuracy check failed: ' + (e && e.message ? e.message : e);
    return;
  }
  window.__lastAccuracyReport = report;
  if (line) {
    line.textContent = 'How accurate: about ' + report.rmse + ' m off on average — half the time within '
      + report.p50 + ' m, almost always within ' + report.p95 + ' m.';
  }
}

/* One-click calibration (wizard): tunes the signal setting
 * from the fixes seen so far and installs it. */
function runCalibration() {
  const line = document.getElementById('accuracyLine');
  if (typeof WorldmapLab === 'undefined' || !WorldmapLab.runCalibrationWizard) {
    if (line) line.textContent = 'Calibration is not loaded.';
    return;
  }
  const hist = [];
  Object.values(graph.devices).forEach((d) => {
    (d._obsHistory || []).forEach((h) => hist.push(h));
  });
  const current = (WorldmapSettings.get() || {}).calibrationProfile || 'balanced';
  let tuned;
  try {
    tuned = WorldmapLab.runCalibrationWizard(hist, current);
  } catch (e) {
    if (line) line.textContent = 'Calibration failed: ' + (e && e.message ? e.message : e);
    return;
  }
  try {
    if (typeof WorldmapPathloss !== 'undefined') {
      WorldmapPathloss.CALIBRATION.wizard = tuned;
    }
    if (typeof WorldmapEstimator !== 'undefined' && WorldmapEstimator.setProfile) {
      WorldmapEstimator.setProfile('wizard');
    }
    WorldmapSettings.set({ calibrationProfile: 'wizard' });
    syncWorldmapSettingsUI(WorldmapSettings.get());
  } catch (e) {
    // The numbers are still shown even if install fails.
  }
  if (line) {
    line.textContent = 'Calibrated: signal noise ' + tuned.noise + ', signal loss ' + tuned.attenuation + ' — applied.';
  }
}

/* Evidence export: every location with the observations,
 * calibration, confidence and error behind it, as JSON. */
function exportEvidence() {
  const line = document.getElementById('accuracyLine');
  if (typeof WorldmapEvidence === 'undefined' || !WorldmapEvidence.exportEvidenceJSON) {
    if (line) line.textContent = 'Save is not loaded.';
    return;
  }
  const packs = [];
  Object.values(graph.devices).forEach((d) => {
    (d.locations || []).forEach((loc) => {
      if (loc.evidence) packs.push(loc.evidence);
    });
  });
  let text = '';
  try {
    text = WorldmapEvidence.exportEvidenceJSON(packs);
  } catch (e) {
    if (line) line.textContent = 'Save failed: ' + (e && e.message ? e.message : e);
    return;
  }
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'worldmap-evidence.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (line) line.textContent = 'Saved ' + packs.length + ' locations with their evidence.';
}

/* Click the map to drop a sensor at that spot. */
function togglePlaceSensor() {
  placeSensorMode = !placeSensorMode;
  gpsStatus(placeSensorMode ? 'Click the map to drop a sensor.' : '');
}

function placeSensorsForMe() {
  let count = 0;
  try {
    count = WorldmapSensors.SensorStore.autoPlace().length;
    WorldmapRF.setRFSensors(WorldmapSensors.SensorStore.list());
    if (typeof renderSensors === 'function') renderSensors();
  } catch (e) {
    gpsStatus('Could not place sensors: ' + (e && e.message ? e.message : e));
    return;
  }
  gpsStatus(count + ' sensors placed.');
}

if (typeof map !== 'undefined' && map) {
  map.on('click', (e) => {
    if (!placeSensorMode) return;
    const placed = WorldmapSensors.SensorStore.placeAt(e.latlng.lat, e.latlng.lng);
    if (placed) {
      try { WorldmapRF.setRFSensors(WorldmapSensors.SensorStore.list()); } catch (err) { /* no RF yet */ }
      if (typeof renderSensors === 'function') renderSensors();
      gpsStatus('Sensor placed at ' + placed.lat.toFixed(5) + ', ' + placed.lon.toFixed(5) + '.');
    }
  });
}

document.getElementById('gpsSource').addEventListener('change', (e) => {
  WorldmapSettings.set({ gpsSource: e.target.value });
});
document.getElementById('tileMode').addEventListener('change', (e) => {
  WorldmapSettings.set({ tileMode: e.target.value });
});
document.getElementById('gpxFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  WorldmapGPS.loadGPXFile(file, 'gpx-track').then(
    (n) => gpsStatus('GPX plotted: ' + n + ' fixes.'),
    (err) => gpsStatus('GPX failed: ' + (err && err.message ? err.message : err))
  );
});
document.getElementById('nmeaFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  WorldmapGPS.loadNMEAFile(file, 'nmea-track').then(
    (n) => gpsStatus('NMEA plotted: ' + n + ' fixes.'),
    (err) => gpsStatus('NMEA failed: ' + (err && err.message ? err.message : err))
  );
});
document.getElementById('mbtilesFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  WorldmapTiles.openMbtilesFile(file).then(
    () => {
      WorldmapSettings.set({ tileMode: 'mbtiles', mbtilesPath: file.name });
      setTileLayer(WorldmapSettings.get());
      gpsStatus('Map file loaded: ' + file.name + '.');
    },
    (err) => gpsStatus('Map file failed: ' + (err && err.message ? err.message : err))
  );
});
document.getElementById('floorPlanFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  WorldmapRooms.loadFloorPlanFromFile(file).then(
    (result) => {
      const n = result && result.rooms ? result.rooms.length : 0;
      if (n) {
        if (typeof renderRoomsOnMap === 'function') renderRoomsOnMap();
        gpsStatus('Floor plan loaded: ' + n + ' room' + (n === 1 ? '' : 's') + '.');
      } else {
        gpsStatus('Floor plan had no rooms in it.');
      }
    },
    (err) => gpsStatus('Floor plan failed: ' + (err && err.message ? err.message : err))
  );
});
document.getElementById('scanFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  WorldmapRFImport.loadScanFile(file, 'scan').then(
    (n) => gpsStatus('Scan plotted: ' + n + ' readings.'),
    (err) => gpsStatus('Scan failed: ' + (err && err.message ? err.message : err))
  );
});
document.getElementById('sensorFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  file.text().then((text) => {
    let n = 0;
    try {
      n = WorldmapSensors.SensorStore.importJSON(text);
      if (!n) n = WorldmapSensors.SensorStore.importCSV(text);
    } catch (err) {
      gpsStatus('Sensors file failed: ' + (err && err.message ? err.message : err));
      return;
    }
    try { WorldmapRF.setRFSensors(WorldmapSensors.SensorStore.list()); } catch (err) { /* no RF yet */ }
    if (typeof renderSensors === 'function') renderSensors();
    gpsStatus(n ? ('Sensors loaded: ' + n + '.') : 'Sensors file had no sensors in it.');
  });
});

/* Test/debug hook (also how the Lucid segment reads state back):
 * map, device graph, bus, settings and GPS parsers. */
window.__worldmap = {
  get map() { return map; },
  get graph() { return graph; },
  bus: bus,
  settings: WorldmapSettings,
  gps: WorldmapGPS,
  lab: typeof WorldmapLab !== 'undefined' ? WorldmapLab : null,
  rooms: typeof WorldmapRooms !== 'undefined' ? WorldmapRooms : null,
  sensors: typeof WorldmapSensors !== 'undefined' ? WorldmapSensors : null,
  rf: typeof WorldmapRF !== 'undefined' ? WorldmapRF : null,
  tiles: typeof WorldmapTiles !== 'undefined' ? WorldmapTiles : null,
  fingerprint: typeof WorldmapFingerprint !== 'undefined' ? WorldmapFingerprint : null,
  continuum: typeof WorldmapContinuum !== 'undefined' ? WorldmapContinuum : null,
};
WorldmapSettings.postToParent({ type: 'worldmap:ready', settings: WorldmapSettings.get() });
